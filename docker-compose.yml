services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - announcord-data:/data
    # Docker keeps container logs forever by default; cap them.
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  announcord-data:
